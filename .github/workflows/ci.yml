name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Run unit tests
        run: pytest tests/ -v --tb=short -k "not test_api"

  docker-build:
    name: Docker — Build
    runs-on: ubuntu-latest
    needs: [lint-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wayos-prep:test .
